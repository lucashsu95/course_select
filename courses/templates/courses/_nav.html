{# 側邊欄導覽。項目順序：選課 → 我的課表 → 個人資料（老師／管理員額外項目接在後面）。 #}
<nav class="nav" aria-label="主要">
  <a href="{% url 'course_list' %}" aria-label="選課" title="選課"{% if request.resolver_match.url_name == 'course_list' or request.resolver_match.url_name == 'course_detail' %} class="active" aria-current="page"{% endif %}>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <span class="nav-label">選課</span></a>
  <a href="{% url 'my_schedule' %}" aria-label="我的課表" title="我的課表"{% if request.resolver_match.url_name == 'my_schedule' %} class="active" aria-current="page"{% endif %}>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M9 4v18M15 4v18"/></svg>
    <span class="nav-label">我的課表</span></a>
  {% if user.is_authenticated %}
  <a href="{% url 'my_profile' %}" aria-label="個人資料" title="個人資料"{% if request.resolver_match.url_name == 'my_profile' %} class="active" aria-current="page"{% endif %}>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
    <span class="nav-label">個人資料</span></a>
  {% endif %}
  {% if user.teacher_profile %}
  <a href="{% url 'teaching' %}" aria-label="我的課程" title="我的課程"{% if request.resolver_match.url_name == 'teaching' or request.resolver_match.url_name == 'course_roster' %} class="active" aria-current="page"{% endif %}>
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V5h16v14z"/><path d="M8 9h8M8 13h5"/></svg>
    <span class="nav-label">我的課程</span></a>
  {% endif %}
  {% if user.is_staff %}
  <a href="{% url 'admin:index' %}" aria-label="管理後台" title="管理後台">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 4 7v4c0 5 3.4 9.4 8 10 4.6-.6 8-5 8-10V7z"/></svg>
    <span class="nav-label">管理後台</span></a>
  {% endif %}
</nav>
