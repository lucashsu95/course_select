  <style>/* 選課系統 — accent ladder (raspberry), ground tinted toward the hue's palest tint.
   Type: DM Sans for latin/figures, Noto Sans TC for Chinese. */

:root {
  --ground: #fbf7f8;
  --surface: #ffffff;
  --raised: #f7f1f3;
  --border: #ece4e7;
  --rule: #f4edef;
  --control: #d1d5db;
  --text: #111827;
  --muted: #5f6672;
  --faint: #6b6b6b;
  --accent: #b8336a;
  --accent-soft: #fdf2f7;
  --accent-track: #f8dbe8;
  --accent-ink: #6b1d3e;
  --primary: #1d1f20;
  --negative: #c4242a;
  --pill-negative-bg: #ffedea;
  --pill-negative-ink: #831c1e;
  --pill-positive-bg: #dcfae5;
  --pill-positive-ink: #04250e;
  --radius-card: 8px;
  --radius-control: 6px;
  --radius-chip: 4px;
  --gap: 24px;
  --font: "DM Sans", "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
  --fs-title: 32px;
  --fs-section: 18px;
  --fs-kpi: 24px;
  --fs-body: 14px;
  --fs-small: 12px;
}

*,
*::before,
*::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--ground);
  color: var(--text);
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, p, dl, dd { margin: 0; }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: 2px;
}

/* shell */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }

.sidebar {
  position: sticky;
  top: 0;
  height: 100vh;
  padding: 24px 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 0 8px;
  color: var(--text);
  font-size: 15px;
  font-weight: 600;
  text-decoration: none;
}
.brand svg { flex: none; }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 34px;
  padding: 0 10px;
  border-radius: var(--radius-control);
  color: var(--muted);
  font-size: 14px;
  text-decoration: none;
  transition: background-color 120ms ease, color 120ms ease;
}
.nav a svg { flex: none; opacity: .8; }
.nav a:hover { background: var(--raised); color: var(--text); }
.nav a.active { background: var(--accent-soft); color: var(--accent-ink); font-weight: 500; }
.nav a.active svg { opacity: 1; }

.sidebar-foot { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }

.who { display: flex; align-items: center; gap: 10px; padding: 0 8px 14px; }
.avatar {
  width: 28px;
  height: 28px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--accent-soft);
  color: var(--accent-ink);
  font-size: 12px;
  font-weight: 600;
}
.who-text { min-width: 0; }
.who-name { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who-meta { font-size: 12px; color: var(--muted); }

.sidebar-foot .inline-form { display: flex; padding: 0 8px; }
.sidebar-foot .btn { width: 100%; }
.sidebar-foot > .who-meta { padding: 0 8px 10px; }

/* mobile top bar */
.topbar {
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  height: 48px;
  padding: 0 16px;
  background: var(--ground);
  border-bottom: 1px solid var(--border);
}
.topbar .brand { padding: 0; }
.menu { position: relative; }
.menu > summary {
  list-style: none;
  height: 32px;
  padding: 0 12px;
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--control);
  border-radius: var(--radius-control);
  background: var(--surface);
  font-size: 13px;
  cursor: pointer;
}
.menu > summary::-webkit-details-marker { display: none; }
.menu .sheet {
  position: fixed;
  inset: 48px 0 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding: 20px 16px;
  background: var(--ground);
  overflow-y: auto;
}
.menu .sidebar-foot { border-top: 0; padding-top: 0; margin-top: 0; }

/* canvas */
.canvas { padding: 32px 40px 72px; min-width: 0; }

.page-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
h1 { font-size: var(--fs-title); line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; }
.sub { margin-top: 8px; color: var(--muted); font-size: 14px; }
.sub .num { color: var(--text); }

h2 { font-size: var(--fs-section); font-weight: 600; }

/* notices */
.notice {
  margin-bottom: 20px;
  padding: 10px 14px;
  border-radius: var(--radius-card);
  background: var(--raised);
  font-size: 13px;
}
.notice-success { background: var(--pill-positive-bg); color: var(--pill-positive-ink); }
.notice-error { background: var(--pill-negative-bg); color: var(--pill-negative-ink); }

/* buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 32px;
  padding: 0 14px;
  border: 1px solid transparent;
  border-radius: var(--radius-control);
  font-size: 13px;
  font-weight: 500;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #000; }
.btn-secondary { background: var(--surface); border-color: var(--control); color: var(--text); }
.btn-secondary:hover { background: var(--raised); border-color: var(--muted); }
.btn-quiet { background: transparent; color: var(--muted); padding: 0 10px; }
.btn-quiet:hover { color: var(--text); background: var(--raised); }
.btn:active { transform: translateY(1px); }
.inline-form { margin: 0; display: inline-flex; }

/* filters */
.filters {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 160px auto;
  gap: 12px;
  margin: 24px 0 12px;
}
.filters input,
.filters select {
  height: 36px;
  min-width: 0;
  padding: 0 12px;
  border: 1px solid var(--control);
  border-radius: var(--radius-control);
  background: var(--surface);
  font-size: 14px;
}
.filters input::placeholder { color: var(--faint); }
.filters input:hover,
.filters select:hover { border-color: var(--muted); }
.filters .btn { height: 36px; padding: 0 20px; font-size: 14px; }

/* course rows */
.list-head,
.course-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 132px 158px 64px 140px 92px;
  gap: 20px;
  align-items: center;
}
.list-head {
  padding: 12px 0 8px;
  color: var(--muted);
  font-size: 12px;
}
.list-head .right,
.seats { justify-self: end; text-align: right; }

.meta { display: contents; }
.c-code { font-size: 13px; white-space: nowrap; }
.c-code .room { margin-left: 6px; color: var(--muted); font-size: 12px; }
.c-time { font-size: 13px; color: var(--muted); white-space: nowrap; }
.c-credits { font-size: 13px; color: var(--muted); text-align: right; white-space: nowrap; }
.course-row .action { justify-self: end; display: flex; }

.courses { list-style: none; margin: 0; padding: 0; }
.course-row { padding: 16px 0; border-top: 1px solid var(--rule); }
.courses .course-row:first-child { border-top: 1px solid var(--border); }

.course-name {
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  text-decoration: none;
}
.course-name:hover { color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; }
.course-meta { margin-top: 4px; color: var(--muted); font-size: 13px; }

.seats-num { font-size: 15px; font-weight: 500; }
.seats-num .of { color: var(--muted); font-size: 12px; font-weight: 400; }
.track {
  width: 96px;
  height: 4px;
  margin-top: 6px;
  margin-left: auto;
  border-radius: 2px;
  background: var(--accent-track);
  overflow: hidden;
}
.track > span { display: block; height: 100%; background: var(--accent); }
.full-flag {
  display: inline-block;
  margin-top: 6px;
  padding: 1px 6px;
  border-radius: var(--radius-chip);
  background: var(--pill-negative-bg);
  color: var(--pill-negative-ink);
  font-size: 11px;
  font-weight: 500;
}

.empty {
  margin-top: 8px;
  padding: 20px;
  border: 1px dashed var(--control);
  border-radius: var(--radius-card);
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}
.empty a { color: var(--accent-ink); }

/* detail */
.detail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.detail-head .btn { height: 36px; padding: 0 20px; font-size: 14px; }
.detail-grid {
  display: grid;
  grid-template-columns: minmax(0, 2fr) minmax(0, 1fr);
  gap: 40px;
  align-items: start;
  margin-top: 36px;
}
.syllabus h2 { margin-bottom: 12px; }
.syllabus p { font-size: 15px; line-height: 1.75; max-width: 62ch; }

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-card);
  padding: 20px;
}
.facts h2 { margin-bottom: 16px; }
.facts dl { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px 12px; font-size: 14px; }
.facts dt { color: var(--muted); font-size: 13px; }
.facts dd { margin: 0; }
.facts .seats { justify-self: stretch; text-align: left; }
.facts .track { margin-left: 0; width: 100%; }

.login-hint { color: var(--muted); font-size: 13px; }
.login-hint a { color: var(--accent-ink); }

/* schedule */
.week-wrap {
  margin-top: 24px;
  padding: 8px 8px 4px;
  overflow-x: auto;
}
.week {
  width: 100%;
  min-width: 640px;
  border-collapse: collapse;
  table-layout: fixed;
}
.week thead th {
  padding: 10px 4px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 500;
  text-align: center;
}
.week thead th:first-child { width: 44px; }
.week tbody tr { border-top: 1px solid var(--rule); }
.week tbody th {
  position: sticky;
  left: 0;
  z-index: 1;
  background: var(--surface);
  color: var(--muted);
  font-size: 12px;
  font-weight: 400;
  text-align: center;
}
.week td { height: 56px; padding: 3px; vertical-align: top; }

.slot {
  display: block;
  height: 100%;
  padding: 7px 9px;
  border-radius: var(--radius-control);
  background: var(--accent-soft);
  text-decoration: none;
}
.slot:hover { background: var(--accent-track); }
.slot-name { display: block; color: var(--accent-ink); font-size: 13px; font-weight: 500; line-height: 1.3; }
.slot-meta { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; line-height: 1.4; }

.mine { margin-top: 40px; }
.mine-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 4px; }
.mine-head span { color: var(--muted); font-size: 13px; }
.courses--mine .course-row { grid-template-columns: minmax(0, 1fr) 92px; }

/* tablet / phone */
@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .sidebar { display: none; }
  .topbar { display: flex; position: sticky; top: 0; z-index: 10; }
  .canvas { padding: 24px 20px 64px; }
  .detail-grid { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  h1 { font-size: 26px; }

  .menu > summary { height: 40px; padding: 0 14px; font-size: 14px; }
  .menu .nav a { height: 44px; font-size: 15px; }
  .menu .nav a svg { width: 18px; height: 18px; }
  .menu .btn { height: 44px; font-size: 14px; }
  .menu .who-name { font-size: 14px; }
}

@media (max-width: 640px) {
  .canvas { padding: 20px 16px 56px; }
  h1 { font-size: 24px; }

  .filters { grid-template-columns: minmax(0, 1fr) 116px; gap: 8px; margin: 20px 0 8px; }
  .filters input,
  .filters select { height: 44px; font-size: 15px; }
  .filters .btn { grid-column: 1 / -1; height: 44px; }

  .list-head { display: none; }
  .course-row {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
      "identity action"
      "meta meta"
      "seats seats";
    gap: 6px 12px;
    padding: 14px 0;
  }
  .course-row .identity { grid-area: identity; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; }
  .meta {
    grid-area: meta;
    display: flex;
    flex-wrap: wrap;
    gap: 2px 6px;
    color: var(--muted);
  }
  .meta > * + *::before { content: "· "; color: var(--muted); }
  .c-code,
  .c-time,
  .c-credits { font-size: 13px; color: var(--muted); text-align: left; }
  .c-code .room { font-size: 13px; }
  .course-row .seats { grid-area: seats; justify-self: stretch; text-align: left; display: flex; align-items: center; gap: 8px; }
  .course-row .action { grid-area: action; }
  .course-row .action .btn { height: 44px; padding: 0 16px; font-size: 14px; }
  .course-row .track { margin: 0; width: 96px; flex: none; }
  .full-flag { margin-top: 0; }
  .course-name { font-size: 16px; }
  .course-meta { font-size: 13px; }
  .seats-num { font-size: 16px; }
  .courses--mine .course-row { grid-template-areas: none; }

  .detail-head { gap: 16px; }
  .detail-head .action { width: 100%; }
  .detail-head .action .btn { width: 100%; height: 44px; }
  .detail-grid { margin-top: 28px; }
  .syllabus p { font-size: 15px; }
  .week-wrap { padding: 8px; }
}
</style>
